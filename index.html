<style>
:root{--bg:#4a3826;--ink:#f1e4c8;--gold:#c99a45}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#intro,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--bg);padding:24px;box-sizing:border-box}

#end p{margin:14px 0 0;font-size:14px;opacity:.8}
#sv{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;font-size:15px;padding:10px 22px;background:rgba(20,12,6,.6)}
</style>
</head>
