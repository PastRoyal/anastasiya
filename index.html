<head>

<title>Для Анастасии</title>

<style>
:root{--bg:#4a3826;--ink:#f1e4c8;--gold:#c99a45}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#intro,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--bg);padding:24px;box-sizing:border-box}
#intro h1{font:400 34px "Marck Script",cursive;margin:0 0 26px}

#end{background:rgba(20,12,6,.94);display:none}
#end img{max-width:92%;max-height:70%;border:6px solid var(--gold)}
#end p{margin:14px 0 0;font-size:14px;opacity:.8}
#sv{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;font-size:15px;padding:10px 22px;background:rgba(20,12,6,.6)}
</style>
</head>

async function pass(R,dur,thr,ml,bl,pauses){
  var ref=blur(rd,bl);cp=ref;gp=new Float32Array(W*H);for(var i=0;i<W*H;i++)gp[i]=.3*ref[i*4]+.59*ref[i*4+1]+.11*ref[i*4+2];

  for(var cx=0;cx<gw;cx++)for(var cy=0;cy<gh;cy++){var x=Math.min(W-1,((cx+Math.random())*W/gw)|0),y=Math.min(H-1,((cy+Math.random())*H/gh)|0),j=(y*W+x)*4;
